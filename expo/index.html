<style>
/* Unlock screen: one centred column. The map itself is encrypted below and only exists after the right password. */
:root { --bg: #f3f5f4; --surface: #ffffff; --ink: #15202b; --muted: #56626e; --line-strong: #95a1a9; --accent: #c53d13; --focus: #1d5fd0; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f151a; --surface: #172028; --ink: #e6ecf0; --muted: #a0adb8; --line-strong: #52616d; --accent: #ff7a4d; --focus: #86b4ff; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
main { width: 100%; max-width: 380px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 26px; line-height: 1.15; }
p { margin: 0; color: var(--muted); }
form { display: grid; gap: 10px; }
label { font-weight: 700; font-size: 15px; }
input {
  width: 100%; min-height: 50px; padding: 10px 12px; border: 1.5px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit;
}
input:focus-visible { outline: 3px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
input[aria-invalid="true"] { border-color: var(--accent); }
button { min-height: 50px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font: 700 17px/1 system-ui, -apple-system, sans-serif; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: wait; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.err { color: var(--accent); font-weight: 700; font-size: 15px; }
[hidden] { display: none !important; }
</style>
</head>

  <form id="unlock" hidden novalidate>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <p class="err" id="err" role="alert" hidden></p>
    <button id="go" type="submit">Open the map</button>
    <p>Ask your manager if you don't have the password. This phone remembers it after the first time.</p>
  </form>
</main>

  const STORE = 'mse26-unlock';
  const $ = id => document.getElementById(id);
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

  async function keyFrom(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(LOCK.salt), iterations: LOCK.iter, hash: 'SHA-256' }, base, 256);
  }
  async function decrypt(rawKey) {
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(LOCK.iv) }, key, bytes(LOCK.data)));
  }
  // Swap the unlock screen for the map. A remembered key decrypts before this page finishes loading, and
  // document.open() then leaves the unlock screen in place, so wait for the page to finish first.
  function show(html) {
    const swap = () => { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', swap, { once: true });
    else swap();
  }
  // This phone keeps the derived key (not the password) so reps unlock once.
  const recall = () => {
    try { const s = JSON.parse(localStorage.getItem(STORE)); return s && s.salt === LOCK.salt ? bytes(s.key) : null; }
    catch { return null; }
  };
  const remember = raw => {
    try { localStorage.setItem(STORE, JSON.stringify({ salt: LOCK.salt, key: toB64(raw) })); }
    catch (err) { console.warn('Could not remember the password on this phone', err.name); }
  };
  const forget = () => { try { localStorage.removeItem(STORE); } catch { /* storage blocked: nothing saved */ } };

  function showForm() {
    $('status').hidden = true;
    $('unlock').hidden = false;
    $('pw').focus();
  }
  function fail(msg) {
    $('err').textContent = msg;
    $('err').hidden = false;
    $('pw').setAttribute('aria-invalid', 'true');
    $('go').disabled = false;
    $('go').textContent = 'Open the map';
    $('pw').select();
  }

  if (!window.crypto?.subtle) {
    $('status').textContent = "This browser can't open the locked map. Open the link in Safari or Chrome, and update the phone if it still won't open.";
    return;
  }
  $('unlock').addEventListener('submit', async e => {
    e.preventDefault();
    const password = $('pw').value;
    if (!password) { fail('Type the password, then tap Open the map.'); return; }
    $('go').disabled = true;
    $('go').textContent = 'Opening…';
    let raw, html;
    try {
      raw = await keyFrom(password);
      html = await decrypt(raw);
    } catch (err) {
      if (err.name !== 'OperationError') console.error('Unlock failed', err.name, err.message);
      fail("That password didn't work. Check capital letters and symbols, then try again.");
      return;
    }
    remember(raw);
    show(html);
  });
  $('pw').addEventListener('input', () => { $('err').hidden = true; $('pw').removeAttribute('aria-invalid'); });

  const saved = recall();
  if (!saved) { showForm(); return; }
  $('status').textContent = 'Opening…';
  decrypt(saved).then(show).catch(() => { forget(); showForm(); });
})();
